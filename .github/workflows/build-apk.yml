name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: version name (x.y.z)
        required: true
        default: 1.0.16

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Toolchain
        env:
          SYSTEM_IMAGE: platform-tools
        run: bash tooling/setup-toolchain.sh

      - name: Build arm64 release
        run: |
          source tooling/env.sh
          tooling/build-apk.sh --build-name "${{ inputs.build_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error